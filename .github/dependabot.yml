version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # One pull request a month for all actions, so pairs such as upload-artifact and
    # download-artifact move together. KeyboardShortcuts (Package.swift) is bumped by hand:
    # its licence text in the About window has to change with it.
    groups:
      actions:
        patterns: ["*"]
