name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Xcode 27 is required: the build relies on SwiftPM's Swift Build backend.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/test-attachments"
          swift test --attachments-path "$RUNNER_TEMP/test-attachments"

      # Golden-image failures attach the expected, actual and diff images (NFR-17).
      - name: Upload test attachments
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-attachments-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-attachments
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the String Catalog is up to date
        run: |
          scripts/sync-strings.sh
          git diff --exit-code Resources/Localizable.xcstrings \
            || { echo "::error::Run scripts/sync-strings.sh and commit Resources/Localizable.xcstrings."; exit 1; }

      - name: Build Glint.app (release, ad-hoc signed)
        env:
          GLINT_SIGN_IDENTITY: "-"
          GLINT_VERSION: 0.0.0-ci.${{ github.run_number }}
          GLINT_BUILD: ${{ github.run_number }}
        run: scripts/build-app.sh release

      - name: Package
        run: scripts/package-release.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Glint-ci-${{ github.run_number }}
          path: dist/
          retention-days: 14

  launch-smoke-test:
    # NFR-11: the app built with the newest SDK must still launch on the older supported macOS
    # versions. The full test suite runs on macOS 27 above.
    name: Launch on macOS ${{ matrix.macos }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        macos: ["15", "26"]
    runs-on: macos-${{ matrix.macos }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Glint-ci-${{ github.run_number }}
          path: dist

      - name: Unpack Glint.app
        run: ditto -x -k dist/Glint-*.zip build

      - name: Launch and check it stays running
        run: scripts/smoke-launch.sh build/Glint.app
