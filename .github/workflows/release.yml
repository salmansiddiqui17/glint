name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) tests, builds, packages and
# publishes a GitHub release with Glint-<version>.zip, Glint-<version>.dmg and SHA256SUMS.txt.
#
# Builds are ad-hoc signed. To ship Developer ID signed, notarized builds, set the repository
# variable NOTARIZE to "true" and add the secrets listed in README › Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release
  id-token: write        # build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Import the Developer ID certificate
        if: vars.NOTARIZE == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity in the certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SECURE_TIMESTAMP=1" >> "$GITHUB_ENV"

      - name: Build Glint.app
        run: |
          GLINT_SIGN_IDENTITY="${SIGN_IDENTITY:--}" \
          GLINT_SECURE_TIMESTAMP="${SECURE_TIMESTAMP:-0}" \
          GLINT_VERSION="$VERSION" \
          GLINT_BUILD="${{ github.run_number }}" \
            scripts/build-app.sh release

      - name: Notarize
        if: vars.NOTARIZE == 'true'
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/notarize.sh
          rm "$NOTARY_KEY_PATH"

      - name: Package
        run: scripts/package-release.sh "$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md (up to the next version or the
          # link references), else GitHub's generated notes; then how to install.
          NOTES="$RUNNER_TEMP/notes.md"
          awk -v version="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" version "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          FLAGS=(--title "Glint $VERSION" --verify-tag)
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          if [[ -s "$NOTES" ]] && grep -q '[^[:space:]]' "$NOTES"; then
            if [[ "${{ vars.NOTARIZE }}" == "true" ]]; then
              GATEKEEPER="Signed with a Developer ID and notarized by Apple."
            else
              GATEKEEPER="This build is not notarized yet. On first launch, open **System Settings › Privacy & Security** and click **Open Anyway**, or run \`xattr -dr com.apple.quarantine /Applications/Glint.app\`."
            fi
            cat >> "$NOTES" <<EOF

          ### Install
          Requires a Mac with Apple silicon and macOS 15 or later.
          1. Download **Glint-$VERSION.dmg** below, open it and drag **Glint** into **Applications**.
          2. $GATEKEEPER
          3. Grant **Screen Recording** when asked. Glint lives in the menu bar; press **⇧⌘9** to capture.

          Checksums are in \`SHA256SUMS.txt\`. To verify build provenance: \`gh attestation verify Glint-$VERSION.dmg --repo $GITHUB_REPOSITORY\`.
          EOF
            FLAGS+=(--notes-file "$NOTES")
          else
            FLAGS+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${FLAGS[@]}"

      - name: Remove the signing keychain
        if: always() && vars.NOTARIZE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
